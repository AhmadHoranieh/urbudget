# Refreshes text only; never publishes installers or creates a release.
name: Update release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published desktop release whose notes should be refreshed, such as desktop-v1.0.8
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-manifest
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test
        working-directory: web
        run: |
          npm ci
          npx vitest run test/update-release-notes.test.ts

      - name: Read published release notes
        run: gh release view "$TAG" --json tagName,body,isDraft > "$RUNNER_TEMP/release.json"

      - name: Update only matching release notes in R2
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object get urbudget-releases/latest.json --file "$RUNNER_TEMP/latest.json" --remote
          node scripts/update-release-notes.mjs "$TAG" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/latest.json"
          npx wrangler r2 object put urbudget-releases/latest.json --file "$RUNNER_TEMP/latest.json" --content-type application/json --remote
