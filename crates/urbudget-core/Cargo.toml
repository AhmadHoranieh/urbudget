[package]
name = "urbudget-core"
version = "1.0.8"
description = "Shared platform-independent UrBudget accounting, imports, and persistence"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1"
base64 = "0.22"
flate2 = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
